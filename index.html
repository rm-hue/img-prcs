<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResNet50 Classifier</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.35s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .spinner { border: 2px solid #e5e7eb; border-top-color: #6366f1; border-radius: 50%; width: 18px; height: 18px; animation: spin 0.6s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .drop-zone.dragover { border-color: #a5b4fc; background-color: #eef2ff; }
        .progress-fill { transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
    </style>
</head>
<body class="bg-stone-100 min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-4xl">

        <!-- Header -->
        <div class="text-center mb-10">
            <p class="text-[10px] uppercase tracking-[0.2em] text-stone-400 mb-2">ResNet50</p>
            <h1 class="text-2xl font-semibold text-stone-800 tracking-tight">Product Quality Inspector</h1>
        </div>

        <!-- Main Panel -->
        <div class="flex gap-5 items-stretch">

            <!-- Left: Image Area -->
            <div class="flex-1 min-w-0">
                <div id="dropZone" class="drop-zone relative border-2 border-dashed border-stone-200 rounded-2xl h-full min-h-[380px] flex items-center justify-center cursor-pointer transition-all duration-200 hover:border-stone-300 bg-white overflow-hidden">

                    <input type="file" id="imgInput" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">

                    <!-- Placeholder -->
                    <div id="placeholder" class="text-center select-none">
                        <div class="mx-auto w-12 h-12 rounded-full border border-stone-200 flex items-center justify-center mb-4">
                            <svg class="w-5 h-5 text-stone-300" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909M3.75 21h16.5A2.25 2.25 0 0022.5 18.75V5.25A2.25 2.25 0 0020.25 3H3.75A2.25 2.25 0 001.5 5.25v13.5A2.25 2.25 0 003.75 21z"/>
                            </svg>
                        </div>
                        <p class="text-sm text-stone-400">Drop an image here</p>
                        <p class="text-[11px] text-stone-300 mt-1">or click to browse</p>
                    </div>

                    <!-- Preview -->
                    <div id="previewWrap" class="hidden absolute inset-0 flex items-center justify-center p-4">
                        <img id="previewImg" class="max-h-full max-w-full object-contain rounded-lg" alt="Preview">
                        <button id="clearBtn" class="absolute top-3 right-3 w-7 h-7 rounded-lg bg-white/80 backdrop-blur-sm border border-stone-200 flex items-center justify-center text-stone-400 hover:text-stone-600 hover:bg-white transition-all z-20">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right: Stats Panel -->
            <div class="w-72 flex flex-col gap-3">

                <!-- File info card -->
                <div id="fileInfo" class="rounded-2xl border border-stone-200 bg-white p-5 transition-all">
                    <p class="text-[10px] uppercase tracking-[0.15em] text-stone-400 mb-3">Image</p>
                    <div id="fileDetails" class="space-y-2">
                        <p class="text-xs text-stone-300 text-center py-4">No image selected</p>
                    </div>
                </div>

                <!-- Predict Button -->
                <button id="predictBtn" disabled class="w-full py-3 rounded-xl text-sm font-medium transition-all duration-200 bg-indigo-500 text-white hover:bg-indigo-400 active:scale-[0.98] disabled:bg-stone-200 disabled:text-stone-400 disabled:cursor-not-allowed disabled:hover:bg-stone-200">
                    Analyze
                </button>

                <!-- Results card -->
                <div id="results" class="rounded-2xl border border-stone-200 bg-white p-5 flex-1">
                    <p class="text-[10px] uppercase tracking-[0.15em] text-stone-400 mb-3">Results</p>
                    <div id="resultsContent" class="space-y-3">
                        <p class="text-xs text-stone-300 text-center py-6">Awaiting analysis</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const input = document.getElementById('imgInput');
        const previewImg = document.getElementById('previewImg');
        const previewWrap = document.getElementById('previewWrap');
        const placeholder = document.getElementById('placeholder');
        const predictBtn = document.getElementById('predictBtn');
        const resultsContent = document.getElementById('resultsContent');
        const dropZone = document.getElementById('dropZone');
        const clearBtn = document.getElementById('clearBtn');
        const fileDetails = document.getElementById('fileDetails');
        let currentFile = null;

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        function loadImage(file) {
            currentFile = file;
            previewImg.src = URL.createObjectURL(file);
            previewWrap.classList.remove('hidden');
            placeholder.classList.add('hidden');
            predictBtn.disabled = false;

            fileDetails.innerHTML = `
                <div class="flex justify-between items-center">
                    <span class="text-[11px] text-stone-400">Name</span>
                    <span class="text-xs text-stone-600 truncate max-w-[140px]">${file.name}</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-[11px] text-stone-400">Size</span>
                    <span class="text-xs text-stone-600">${formatSize(file.size)}</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-[11px] text-stone-400">Type</span>
                    <span class="text-xs text-stone-600">${file.type.split('/')[1].toUpperCase()}</span>
                </div>
            `;

            resultsContent.innerHTML = '<p class="text-xs text-stone-300 text-center py-6">Awaiting analysis</p>';
        }

        function clearImage() {
            currentFile = null;
            input.value = '';
            previewImg.src = '';
            previewWrap.classList.add('hidden');
            placeholder.classList.remove('hidden');
            predictBtn.disabled = true;
            fileDetails.innerHTML = '<p class="text-xs text-stone-300 text-center py-4">No image selected</p>';
            resultsContent.innerHTML = '<p class="text-xs text-stone-300 text-center py-6">Awaiting analysis</p>';
        }

        input.onchange = () => {
            const file = input.files[0];
            if (file) loadImage(file);
        };

        clearBtn.onclick = (e) => { e.stopPropagation(); clearImage(); };

        ['dragenter', 'dragover'].forEach(evt => {
            dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        });
        ['dragleave', 'drop'].forEach(evt => {
            dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); });
        });
        dropZone.addEventListener('drop', (e) => {
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) loadImage(file);
        });

        predictBtn.onclick = async () => {
            if (!currentFile) return;
            predictBtn.disabled = true;
            predictBtn.innerHTML = '<span class="spinner"></span>';
            resultsContent.innerHTML = '<p class="text-xs text-stone-400 text-center py-6"><span class="spinner"></span></p>';

            try {
                const fd = new FormData();
                fd.append('image', currentFile);

                const response = await fetch('http://127.0.0.1:5000/predict', { method: 'POST', body: fd });
                if (!response.ok) throw new Error(`Status: ${response.status}`);
                const data = await response.json();

                if (data.error) {
                    resultsContent.innerHTML = `
                        <div class="fade-in text-center py-4">
                            <div class="w-8 h-8 rounded-full bg-red-50 flex items-center justify-center mx-auto mb-2">
                                <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
                                </svg>
                            </div>
                            <p class="text-xs text-red-500">${data.error}</p>
                        </div>`;
                } else if (data.prediction) {
                    const p = data.prediction;
                    const conf = (p.confidence * 100).toFixed(1);
                    const isBad = p.status === 'BAD';
                    const statusLabel = isBad ? 'Defective' : 'Passed';
                    const badgeBg = isBad ? 'bg-red-50' : 'bg-emerald-50';
                    const badgeIconBg = isBad ? 'bg-red-100' : 'bg-emerald-100';
                    const badgeText = isBad ? 'text-red-600' : 'text-emerald-600';
                    const badgeSub = isBad ? 'text-red-400' : 'text-emerald-400';
                    const barColor = isBad ? 'bg-red-400' : 'bg-emerald-400';
                    const confColor = isBad ? 'text-red-500' : 'text-emerald-500';
                    const verdictColor = isBad ? 'text-red-500' : 'text-emerald-500';
                    const statusIcon = isBad
                        ? '<path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>'
                        : '<path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>';

                    resultsContent.innerHTML = `
                        <div class="fade-in space-y-4">
                            <!-- Status Badge -->
                            <div class="flex items-center gap-2.5 ${badgeBg} rounded-xl p-3">
                                <div class="w-8 h-8 rounded-full ${badgeIconBg} flex items-center justify-center flex-shrink-0">
                                    <svg class="w-4 h-4 ${badgeText}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">${statusIcon}</svg>
                                </div>
                                <div>
                                    <p class="text-sm font-semibold ${badgeText}">${statusLabel}</p>
                                    <p class="text-[10px] ${badgeSub}">${p.status} quality</p>
                                </div>
                            </div>

                            <!-- Category -->
                            <div class="flex justify-between items-center">
                                <span class="text-[11px] text-stone-400 uppercase tracking-wide">Category</span>
                                <span class="text-sm text-stone-700 font-medium">${p.product.charAt(0).toUpperCase() + p.product.slice(1)}</span>
                            </div>

                            <!-- Confidence -->
                            <div>
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-[11px] text-stone-400 uppercase tracking-wide">Confidence</span>
                                    <span class="text-xs font-semibold ${confColor}">${conf}%</span>
                                </div>
                                <div class="w-full h-1.5 bg-stone-100 rounded-full overflow-hidden">
                                    <div class="progress-fill h-full rounded-full ${barColor}" style="width: 0%"></div>
                                </div>
                            </div>

                            <!-- Verdict -->
                            <div class="flex justify-between items-center pt-2 border-t border-stone-100">
                                <span class="text-[11px] text-stone-400 uppercase tracking-wide">Verdict</span>
                                <span class="text-xs font-medium ${verdictColor} tracking-wide">${p.status}</span>
                            </div>
                        </div>`;

                    // Animate progress bar
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            const bar = resultsContent.querySelector('.progress-fill');
                            if (bar) bar.style.width = conf + '%';
                        });
                    });
                }
            } catch (error) {
                resultsContent.innerHTML = `
                    <div class="fade-in text-center py-4">
                        <div class="w-8 h-8 rounded-full bg-stone-100 flex items-center justify-center mx-auto mb-2">
                            <svg class="w-4 h-4 text-stone-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m-2.829-2.829a5 5 0 000-7.07m-4.283 2.829a1.5 1.5 0 010 2.12"/>
                            </svg>
                        </div>
                        <p class="text-xs text-stone-500">Server unreachable</p>
                        <p class="text-[10px] text-stone-300 mt-1">Start app.py on port 5000</p>
                    </div>`;
            } finally {
                predictBtn.disabled = false;
                predictBtn.innerHTML = 'Analyze';
            }
        };
    </script>
</body>
</html>
